services:
  fichas-generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fichas-generator
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # Caminho interno fixo; a origem no host vem de FILES_DIR no .env.
      FILES_DIR: /data/registration

    volumes:
      # Mapeia a pasta de saída local para OUTPUT_DIR dentro do container
      - ./output:/usr/src/app/output
      # Mapeia a pasta de assets (logo.png) para dentro do container
      - ./assets:/usr/src/app/assets
      # Mapeia a pasta de templates para dentro do container
      - ./templates:/usr/src/app/templates
      # Cada servidor configura a pasta de inscrições no FILES_DIR do .env.
      - "${FILES_DIR:-/srv/mapas/docker-data/private-files/registration}:/data/registration:ro"

    ports:
      - "4444:4444"

